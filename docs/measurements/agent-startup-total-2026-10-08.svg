<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840">
<title>Agent startup: p30, p50, p70 and p90</title>
<desc>Time from spawn to the configured input screen, in milliseconds. Each tool has 100 fresh launches. The plot uses a logarithmic time axis; the adjacent table gives the exact rounded percentile values. A and B identify separate serial rotation batches.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .small{font-size:15px;fill:#536170}.num{font-size:18px;font-variant-numeric:tabular-nums}</style>
<text x="32" y="42" font-size="30" font-weight="700">Fresh agent startup</text>
<text x="32" y="73" font-size="18" >Spawn → configured input screen · milliseconds · 100 launches per tool</text>
<circle cx="36" cy="103" r="5" fill="#2563eb"/>
<text x="49" y="109" font-size="17" >p30</text>
<circle cx="156" cy="103" r="5" fill="#07866a"/>
<text x="169" y="109" font-size="17" >p50</text>
<circle cx="276" cy="103" r="5" fill="#b86200"/>
<text x="289" y="109" font-size="17" >p70</text>
<circle cx="396" cy="103" r="5" fill="#9438a2"/>
<text x="409" y="109" font-size="17" >p90</text>
<text x="550" y="109" font-size="16" class="small">Logarithmic time axis; lower is faster</text>
